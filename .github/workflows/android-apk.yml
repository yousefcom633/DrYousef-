name: DrYousef Tasks - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Organize project
        shell: bash
        run: |
          set -e
          mkdir -p src/app src/components/screens src/lib src/db public/icons

          move_file() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }

          for f in App Onboarding SettingsSheet TaskRow TaskSheet ui; do
            move_file "$f.tsx" "src/components/$f.tsx"
          done

          move_file icons.ts src/components/icons.ts

          for f in Focus Profile Store Tasks Today; do
            move_file "$f.tsx" "src/components/screens/$f.tsx"
          done

          for f in fx i18n seed store types utils; do
            for ext in ts tsx; do
              move_file "$f.$ext" "src/lib/$f.$ext"
            done
          done

          move_file page.tsx src/app/page.tsx
          move_file layout.tsx src/app/layout.tsx
          move_file globals.css src/app/globals.css

          move_file favicon.svg public/favicon.svg
          move_file manifest.webmanifest public/manifest.webmanifest
          move_file sw.js public/sw.js
          move_file icon.svg public/icons/icon.svg

          test -f package.json
          test -f src/app/page.tsx
          test -f src/app/layout.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7

      - name: Configure Next.js
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            trailingSlash: true
          };

          export default nextConfig;
          EOF

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.dryousef.tasks",
            appName: "Dr.Yousef Tasks",
            webDir: "out"
          };

          export default config;
          EOF

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrYousef-Tasks-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
