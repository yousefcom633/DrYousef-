name: DrYousef Tasks Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Organize files
        run: |
          set -e
          mkdir -p src/app src/components/screens src/lib public

          move_file() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }

          for f in App Onboarding SettingsSheet TaskRow TaskSheet ui; do
            move_file "$f.tsx" "src/components/$f.tsx"
          done

          move_file icons.ts src/components/icons.ts

          for f in Focus Profile Store Tasks Today; do
            move_file "$f.tsx" "src/components/screens/$f.tsx"
          done

          for f in fx i18n seed store types utils; do
            for ext in ts tsx; do
              move_file "$f.$ext" "src/lib/$f.$ext"
            done
          done

          move_file page.tsx src/app/page.tsx
          move_file layout.tsx src/app/layout.tsx
          move_file globals.css src/app/globals.css

          move_file favicon.svg public/favicon.svg
          move_file manifest.webmanifest public/manifest.webmanifest
          move_file sw.js public/sw.js

          test -f package.json
          test -f src/app/page.tsx
          test -f src/components/App.tsx

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7
          npm install @capacitor/cli@7
          npm install @capacitor/android@7

      - name: Configure Next
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const config: NextConfig = {
            output: "export",
            assetPrefix: ".",
            trailingSlash: true,
            images: {
              unoptimized: true
            }
          };

          export default config;
          EOF

          rm -rf src/app/api

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.dryousef.tasks",
            appName: "Dr.Yousef Tasks",
            webDir: "out",
            server: {
              hostname: "localhost",
              androidScheme: "https"
            }
          };

          export default config;
          EOF

      - name: Build Next
        run: npm run build

      - name: Verify web files
        run: |
          set -e
          test -s out/index.html
          echo "HTML FOUND"
          find out -maxdepth 3 -type f | head -50
          test -d out/_next

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android assets
        run: |
          set -e
          test -s android/app/src/main/assets/public/index.html
          test -d android/app/src/main/assets/public/_next
          echo "ANDROID WEB ASSETS VERIFIED"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrYousef-Tasks-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
