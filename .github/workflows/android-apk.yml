name: DrYousef Tasks - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Organize project files
      - name: Organize project
        shell: bash
        run: |
          set -e

          mkdir -p src/app
          mkdir -p src/components/screens
          mkdir -p src/lib
          mkdir -p src/db
          mkdir -p public/icons

          move_file() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }

          # Components
          for f in App Onboarding SettingsSheet TaskRow TaskSheet ui; do
            move_file "$f.tsx" "src/components/$f.tsx"
          done

          move_file icons.ts src/components/icons.ts

          # Screens
          for f in Focus Profile Store Tasks Today; do
            move_file "$f.tsx" "src/components/screens/$f.tsx"
          done

          # Libraries
          for f in fx i18n seed store types utils; do
            for ext in ts tsx; do
              move_file "$f.$ext" "src/lib/$f.$ext"
            done
          done

          # Database
          move_file index.ts src/db/index.ts
          move_file schema.ts src/db/schema.ts

          # Next.js files
          move_file page.tsx src/app/page.tsx
          move_file layout.tsx src/app/layout.tsx
          move_file globals.css src/app/globals.css

          # Public files
          move_file favicon.svg public/favicon.svg
          move_file manifest.webmanifest public/manifest.webmanifest
          move_file sw.js public/sw.js
          move_file icon.svg public/icons/icon.svg

          # Validate
          test -f package.json
          test -f src/app/page.tsx
          test -f src/app/layout.tsx
          test -f src/components/App.tsx
          test -f src/lib/store.tsx

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 6. Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7
          npm install @capacitor/cli@7
          npm install @capacitor/android@7
          npm install @capacitor/local-notifications@7

      # 7. Configure offline export
      - name: Configure Next.js
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            images: {
              unoptimized: true
            },
            trailingSlash: true
          };

          export default nextConfig;
          EOF

          rm -rf src/app/api

      # 8. Remove external font dependency
      - name: Prepare offline fonts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/app/layout.tsx")
          s = p.read_text()

          lines = []
          for line in s.splitlines():
              if "fonts.googleapis.com" in line:
                  continue
              if "fonts.gstatic.com" in line:
                  continue
              lines.append(line)

          p.write_text("\n".join(lines) + "\n")
          PY

      # 9. Configure Capacitor
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.dryousef.tasks",
            appName: "Dr.Yousef Tasks",
            webDir: "out",
            bundledWebRuntime: false
          };

          export default config;
          EOF

      # 10. Build web application
      - name: Build Next.js
        run: npm run build

      # 11. Add Android
      - name: Add Android
        run: npx cap add android
