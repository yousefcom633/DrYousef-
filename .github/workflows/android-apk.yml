name: Build DrYousef Tasks APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project folders
        shell: bash
        run: |
          set -e

          mkdir -p src/app src/components/screens src/lib src/db
          mkdir -p public/icons

          move_file() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              mkdir -p "$(dirname "$2")"
              mv "$1" "$2"
            fi
          }

          # Components
          for f in App Onboarding SettingsSheet TaskRow TaskSheet icons ui; do
            move_file "$f.tsx" "src/components/$f.tsx"
          done

          # Screens
          for f in Focus Profile Store Tasks Today; do
            move_file "$f.tsx" "src/components/screens/$f.tsx"
          done

          # Libraries
          for f in fx i18n seed store types utils; do
            for ext in ts tsx; do
              move_file "$f.$ext" "src/lib/$f.$ext"
            done
          done

          # Database
          move_file index.ts src/db/index.ts
          move_file schema.ts src/db/schema.ts

          # Next.js app
          move_file page.tsx src/app/page.tsx
          move_file layout.tsx src/app/layout.tsx
          move_file globals.css src/app/globals.css

          # Public files
          move_file favicon.svg public/favicon.svg
          move_file manifest.webmanifest public/manifest.webmanifest
          move_file sw.js public/sw.js
          move_file icon.svg public/icons/icon.svg

          # Validate project
          test -f package.json
          test -f src/app/page.tsx
          test -f src/app/layout.tsx
          test -f src/components/App.tsx
          test -f src/lib/store.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@^7
          npm install @capacitor/cli@^7
          npm install @capacitor/android@^7
          npm install @capacitor/local-notifications@^7

      - name: Configure Next.js
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            images: { unoptimized: true },
            trailingSlash: true,
          };

          export default nextConfig;
          EOF

          # Remove server-only API routes for offline static export
          rm -rf src/app/api

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.dryousef.tasks",
            appName: "Dr.Yousef Tasks",
            webDir: "out",
            bundledWebRuntime: false,
            plugins: {
              LocalNotifications: {
                smallIcon: "ic_stat_icon_config_sample",
                iconColor: "#6c63ff"
              }
            }
          };

          export default config;
          EOF

      - name: Build offline web app
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrYousef-Tasks-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
